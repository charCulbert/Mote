<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mote</title>
<link rel="icon" href="data:,">
<style>
:root { color-scheme: dark; background: #080808; color: #bdbdb9; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; --line: #ffffff24; }
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; }
body { min-width: 320px; min-height: 260px; }
main { height: 100%; min-height: 260px; display: grid; grid-template-rows: 44px minmax(80px, 1fr) 116px; padding: 0 20px; }
header { display: flex; align-items: center; gap: 16px; }
h1 { font: inherit; font-size: 14px; font-weight: 400; margin: 0 auto 0 0; color: #eee; }
#tempo { color: #92928e; font-size: 10px; }
button { font: inherit; color: #949490; background: none; border: 1px solid transparent; border-radius: 0; cursor: pointer; min-height: 30px; padding: 5px 8px; }
button:hover { color: #fff; }
button[aria-pressed="true"] { color: #eee; border-color: #777; }
button:focus-visible, compost-slider:focus-visible { outline: 1px solid #aaa; outline-offset: 3px; }
#clear { padding: 5px 0; }
.field { display: grid; grid-template-columns: 1fr auto; align-items: stretch; gap: 12px; min-height: 0; padding: 10px 0 14px; }
#notes { position: relative; min-height: 80px; overflow: hidden; }
.note { position: absolute; width: 7px; height: 7px; margin: -3.5px; border: 1px solid #777773; border-radius: 50%; transform: translate(-50%, -50%); transition: width 70ms, height 70ms, margin 70ms, background 70ms, border-color 70ms; }
.note.active { width: 13px; height: 13px; margin: -6.5px; background: #eee; border-color: #eee; box-shadow: 0 0 16px #ffffff80; }
.note.active::after { content: attr(data-name); position: absolute; left: 19px; top: -2px; color: #d8d8d4; white-space: nowrap; }
#hint { margin: 0; color: #969692; font-size: 11px; min-height: 14px; }
.controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: 72px 44px; gap: 0 24px; align-items: center; border-top: 1px solid var(--line); }
compost-slider { min-width: 0; --compost-accent: #999; --slider-track-height: 1px; --slider-thumb-size: 18px; --slider-label-gap: 9px; --slider-label-size: 11px; --slider-row-gap: 4px; --slider-value-width: 0; }
compost-slider::part(label) { color: #b1b1ad; font-weight: 400; }
compost-slider::part(value) { color: #bbb; font: inherit; }
compost-slider::part(track) { background: #ffffff26; }
compost-slider::part(fill) { background: #ffffff45; }
compost-slider::part(thumb) { height: 7px; width: 1px; background: #eee; }
.order { display: flex; gap: 2px; grid-column: 1 / -1; justify-content: flex-end; align-self: start; }
@media (max-width: 400px) { main { padding: 0 14px; } header { gap: 12px; } .controls { gap: 0 14px; } .order button { padding: 5px; } }
</style>
</head>
<body><main>
<header>
<h1>Mote</h1>
<span id="tempo" aria-label="Host tempo">—</span>
<button id="hold" aria-label="Hold notes" aria-pressed="false" title="Keep the chord after release. The next chord replaces it.">hold</button>
<button id="clear" aria-label="Clear held notes" title="Release all held notes">clear</button>
</header>
<div class="field">
<div id="notes" aria-label="Held pitches"></div>
<p id="hint" role="status">connecting</p>
</div>
<div class="controls">
<compost-slider parameter-id="0" label="rate" min="0" max="7" step="1" value="1" reset-value="1" text="1/4|1/8|1/8T|1/16|1/16T|1/32|1/32T|1/64" title="Note division. Follows the host tempo."></compost-slider>
<compost-slider parameter-id="5" label="octaves" min="1" max="4" step="1" value="1" reset-value="1" unit="×" title="Repeat the held notes over one to four octaves."></compost-slider>
<compost-slider parameter-id="6" label="gate" min="5" max="95" step="1" value="65" reset-value="65" unit="%" title="Length of each note as a percentage of the interval."></compost-slider>
<div class="order" role="group" aria-label="Order">
<button data-order="0" aria-pressed="true">up</button>
<button data-order="1" aria-pressed="false">down</button>
<button data-order="2" aria-pressed="false">up/down</button>
</div>
</div>
</main><script type="module" src="main.js"></script></body>
</html>
